name: monthly-refresh

# Rebuilds the site with FRESH link verification: every URL probe, every
# proposal chain-of-verification check and the verify-queue flags get
# re-tested against the live web once a month. Commits only if something
# actually changed.

on:
  schedule:
    - cron: '0 4 1 * *' # 1st of each month, 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild pages with fresh probes (pwsh is preinstalled)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/build_funding_page.ps1

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Monthly auto-refresh: fresh link verification (probes + CoV + verify queue)"
            git push
          fi
